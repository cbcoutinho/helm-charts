suite: api/worker env scoping
#
# The two roles used to receive byte-identical env: the ingest worker carried the
# whole OAuth/OIDC server leg -- issuer/server URLs, scopes, and a secretKeyRef to
# the OIDC client Secret -- none of which it reads. It resolves its Nextcloud
# client from the app password in the database (_resolve_client ->
# get_user_client_basic_auth), so it needs MCP_DEPLOYMENT_MODE + TOKEN_* +
# DATABASE_URL and nothing else from the auth block.
#
# Both directions are asserted: the API must keep every var (a "scoping" edit
# that silently drops one from the API breaks OAuth at runtime, not at render
# time), and the worker must not regain them.
templates:
  - templates/deployment.yaml
  - templates/worker-deployment.yaml
  - templates/settings-configmap.yaml
  # Not asserted on; the Deployments checksum it, so it must render.
  - templates/secret.yaml

set:
  ingest.splitWorker: true
  auth.mode: login-flow
  auth.loginFlow.existingSecret: tenant-login-flow
  auth.loginFlow.oidcExistingSecret: tenant-oidc-client
  auth.oidc.discoveryUrl: https://nc.example.com/.well-known/openid-configuration
  nextcloud.mcpServerUrl: https://mcp.example.com
  extraEnv:
    - name: SHARED_VAR
      value: both
  extraEnvApi:
    - name: ALLOWED_MGMT_CLIENT
      value: some-client-id
  ingest.worker.extraEnv:
    - name: WORKER_VAR
      value: worker-only

tests:
  - it: keeps the OAuth server leg on the API Pod
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTCLOUD_MCP_SERVER_URL
            value: https://mcp.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_DISCOVERY_URL
            value: https://nc.example.com/.well-known/openid-configuration
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTCLOUD_OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: tenant-oidc-client
                key: client_id

  - it: withholds the OAuth server leg from the ingest worker
    template: templates/worker-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_MCP_SERVER_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_PUBLIC_ISSUER_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: OIDC_DISCOVERY_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_OIDC_CLIENT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_OIDC_CLIENT_SECRET

  - it: still gives the worker the auth env its own client path needs
    template: templates/worker-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_DEPLOYMENT_MODE
            value: login_flow
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: tenant-login-flow
                key: token_encryption_key

  # The other two modes that carry an apiOnlyEnv branch. login-flow above is the
  # deployed one, but oauth and multi-user-basic have the most branches (scopes,
  # a second OIDC Secret name), so a refactor is likeliest to leak the OAuth leg
  # back onto the worker there.
  - it: withholds the OAuth server leg from the worker in oauth mode
    template: templates/worker-deployment.yaml
    set:
      auth.mode: oauth
      auth.oauth.clientId: cid
      auth.oauth.clientSecret: sec
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_OIDC_SCOPES
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_OIDC_CLIENT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_MCP_SERVER_URL

  - it: keeps the OAuth server leg on the API Pod in oauth mode
    template: templates/deployment.yaml
    set:
      auth.mode: oauth
      auth.oauth.clientId: cid
      auth.oauth.clientSecret: sec
      # Pinned so the assertion doesn't carry the (long, churn-prone) default.
      auth.oauth.scopes: openid profile email
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTCLOUD_OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-nextcloud-mcp-server-oauth
                key: clientId
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTCLOUD_OIDC_SCOPES
            value: openid profile email

  # multi-user-basic puts the token-encryption key and the OIDC client creds in
  # the SAME Secret, so this is where a split could most plausibly take the
  # worker's token store with it (or leave the creds behind).
  - it: gives the multi-user-basic worker the token store but not the OIDC creds
    template: templates/worker-deployment.yaml
    set:
      auth.mode: multi-user-basic
      auth.multiUserBasic.enableOfflineAccess: true
      auth.multiUserBasic.existingSecret: mub
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: mub
                key: token_encryption_key
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_OIDC_CLIENT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: NEXTCLOUD_OIDC_SCOPES

  - it: keeps the OIDC creds on the multi-user-basic API Pod
    template: templates/deployment.yaml
    set:
      auth.mode: multi-user-basic
      auth.multiUserBasic.enableOfflineAccess: true
      auth.multiUserBasic.existingSecret: mub
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTCLOUD_OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: mub
                key: client_id

  - it: routes the extraEnv lists to the API Pod (shared + api-only, no worker-only)
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_VAR
            value: both
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOWED_MGMT_CLIENT
            value: some-client-id
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: WORKER_VAR

  - it: routes the extraEnv lists to the worker Pod (shared + worker-only, no api-only)
    template: templates/worker-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_VAR
            value: both
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_VAR
            value: worker-only
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ALLOWED_MGMT_CLIENT
