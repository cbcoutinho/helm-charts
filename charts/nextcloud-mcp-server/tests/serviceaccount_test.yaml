suite: ServiceAccount API-token automount
#
# The app has no Kubernetes client, so it must not be handed a cluster
# credential. Two things are guarded here, both template-time:
#
#  1. The default stays FALSE. This is a flip away from the Helm scaffold
#     default, so it is exactly the kind of value a future scaffold-diff or
#     "align with upstream" change silently reverts.
#  2. It is set at POD level, not only on the ServiceAccount. The SA field is
#     merely a default that a pod spec overrides, and with create=false no SA
#     object is rendered at all -- so the SA-only form would still leave the
#     token mounted on every pod.
#
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
  - templates/worker-deployment.yaml
  # Not asserted on, but both Deployments checksum it to build a
  # checksum/config annotation, so it must load for them to render.
  - templates/secret.yaml
  - templates/settings-configmap.yaml

tests:
  - it: does not mount an API token on the ServiceAccount by default
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: does not mount an API token on the API pod by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: does not mount an API token on the ingest-worker pod by default
    template: templates/worker-deployment.yaml
    set:
      ingest.splitWorker: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # The case the ServiceAccount-level field cannot cover: no SA object is
  # rendered, so only the pod-level field keeps the token off.
  - it: keeps the token off the pod even when the chart creates no ServiceAccount
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # Still an escape hatch: an initContainer that genuinely needs the API.
  - it: mounts the token everywhere when automount is opted back in
    set:
      serviceAccount.automount: true
      ingest.splitWorker: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
        template: templates/worker-deployment.yaml
